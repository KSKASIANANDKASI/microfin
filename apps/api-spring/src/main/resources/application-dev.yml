# Local development only: `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev`
# Never use these values outside your own machine.
spring:
  datasource:
    password: ${DB_PASSWORD:lms}

lms:
  auth:
    dev-echo-reset-token: true
  cors:
    # Phones on the LAN open the apps by IP address, so any origin is accepted in dev.
    origins: "*"
  kyc:
    encryption-key: ${KYC_ENCRYPTION_KEY:ZGV2LW9ubHkta3ljLWtleS0zMi1ieXRlcy1sb25nISE=}
  demo:
    # Loads the sample branch the screens were designed with, when the database is empty.
    seed: true
